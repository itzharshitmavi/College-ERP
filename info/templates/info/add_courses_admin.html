{% load static %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add Course</title>

    <!-- Bootstrap CSS -->
    <link
      href="{% static 'info/homepage/vendor/bootstrap/css/bootstrap.min.css' %}"
      rel="stylesheet"
    />
    <link
      href="{% static 'info/homepage/css/heroic-features.css' %}"
      rel="stylesheet"
    />
    <link
      href="{% static 'info/bootstrap/vendor/fontawesome-free/css/all.min.css' %}"
      rel="stylesheet"
    />
    {% include 'info/includes/theme_head.html' %}

    <style>
      body {
        background-color: #f5f7fa;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .form-container {
        max-width: 720px;
        margin: 50px auto;
        background: #fff;
        padding: 40px 35px;
        border-radius: 12px;
        box-shadow: 0 8px 28px rgba(99, 99, 99, 0.1);
        transition: box-shadow 0.3s ease-in-out;
      }

      .form-container:hover {
        box-shadow: 0 12px 40px rgba(99, 99, 99, 0.15);
      }

      h2 {
        color: #007bff;
        font-weight: 700;
        text-align: center;
        margin-bottom: 30px;
        letter-spacing: 1px;
      }

      .form-label {
        font-weight: 600;
        color: #4a4a4a;
      }

      .btn-primary {
        padding: 10px 40px;
        font-size: 1.1rem;
        font-weight: 600;
        border-radius: 30px;
        transition: background-color 0.3s ease;
      }

      .btn-primary:hover {
        background-color: #0056b3;
      }
    </style>
  </head>

  <body data-theme="{{ theme_mode|default:'light' }}">
    {% include 'info/includes/theme_toggle.html' %}
    {% if messages %}
    <div class="container mt-3">
      {% for message in messages %}
      <div class="alert alert-{{ message.tags }}">{{ message }}</div>
      {% endfor %}
    </div>
    {% endif %}
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
      <div class="container">
        <a class="navbar-brand" href="#">CollegeERP</a>
        <button
          class="navbar-toggler"
          type="button"
          data-toggle="collapse"
          data-target="#navbarResponsive"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarResponsive">
          <ul class="navbar-nav ml-auto">
            <li class="nav-item">
              <a
                href="{% url 'approve' %}"
                onclick="window.location.reload(true);"
                class="nav-link"
              >
                Home
              </a>
              <a
                href="{% url 'department_add' %}"
                onclick="window.location.reload(true);"
                class="nav-link"
              >
                Add Department
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <div class="container form-container">
      <h2>Add New Course</h2>
      <form method="post" action="{% url 'add_course_now' %}" novalidate>
        {% csrf_token %}
        <div class="row g-4">
          <div class="col-md-6">
            <label for="name" class="form-label"
              >Course Name <span class="text-danger">*</span></label
            >
            <input
              id="name"
              name="name"
              type="text"
              maxlength="50"
              class="form-control"
              placeholder="Enter course name"
              required
            />
          </div>
          <div class="col-md-6">
            <label for="shortname" class="form-label">Course Short Name</label>
            <input
              id="shortname"
              name="shortname"
              type="text"
              maxlength="50"
              class="form-control"
              value="X"
              placeholder="Enter short name (optional)"
            />
          </div>
          <div class="col-md-6">
            <label for="department_name" class="form-label"
              >Department Name</label
            >
            <input
              id="department_name"
              name="department_name"
              type="text"
              maxlength="50"
              class="form-control"
              placeholder="Enter Department (leave blank if none)"
              autocomplete="off"
            />
          </div>
          <div class="col-md-6">
            <label for="department_short_name" class="form-label"
              >Department Short Name</label
            >
            <input
              id="department_short_name"
              name="department_short_name"
              type="text"
              maxlength="50"
              class="form-control"
              placeholder="Enter Short Name (leave blank if none)"
              autocomplete="off"
            />
          </div>
          <div class="col-md-6">
            <label for="duration_years" class="form-label"
              >Duration (Years)</label
            >
            <input
              id="duration_years"
              name="duration_years"
              type="number"
              min="1"
              max="10"
              class="form-control"
              placeholder="Enter course duration"
            />
          </div>
          <div class="col-12 text-center mt-4">
            <button type="submit" class="btn btn-primary">Add Course</button>
          </div>
        </div>
      </form>
    </div>
    <script src="{% static 'info/homepage/vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
  </body>
</html>
